name: KAIROS WS baseline B m8 isolated
on:
  push:
    branches: ['run/kairos-ws-control']
    paths:
      - '.github/workflows/kairos-ws-B.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm-b:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Audit pinned Gradium source and runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git fetch origin e5110afd3ead725c940b6411eec4985fb8b111aa --depth=1
          git diff --exit-code e5110afd3ead725c940b6411eec4985fb8b111aa HEAD -- ptts/src ptts-ws-server/src ptts-ws-server/Cargo.toml
          { git rev-parse HEAD; git log --oneline -3; git diff --stat e5110afd3ead725c940b6411eec4985fb8b111aa; nproc; lscpu; free -m; } > out/env.txt
          python3 -m py_compile scripts/kairos_ws_load.py
      - name: Download public checkpoint
        run: |
          python3 -m pip install --user huggingface_hub 'websockets>=13,<17'
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id="gradium/phonon-31m-en",local_dir="phonon-model")
          PY
          find phonon-model -type f | sort > out/model-files.txt
      - name: Build original server
        run: cargo build --release -p ptts-ws-server
      - name: Start original server with connection permit m8
        shell: bash
        run: |
          set -euo pipefail
          RUST_LOG=info ./target/release/ptts-ws-server --model phonon-model --voice-catalog '' --lang en --device cpu --max-concurrent-requests 8 --addr 127.0.0.1:8080 > out/server.log 2>&1 &
          echo $! > out/server.pid
          python3 - <<'PY'
          import socket,time,subprocess
          for i in range(120):
              if subprocess.run(["kill","-0",open("out/server.pid").read().strip()],capture_output=True).returncode:
                  raise SystemExit("server exited before readiness")
              try:
                  s=socket.create_connection(("127.0.0.1",8080),timeout=1);s.close();print("server port ready");break
              except OSError:time.sleep(1)
          else:raise SystemExit("server did not become ready")
          PY
      - name: Run B m8 WebSocket admission test
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kairos_ws_load.py --arm B-connection-permit --limit 8 --sessions 10 --idle-seconds 2 --timeout 120 --output out/ws-B-m8.csv | tee out/ws-B-summary.log
      - name: Upload audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-ws-B-m8-evidence
          path: out/
          retention-days: 30
