name: KAIROS Phonon pinned k1 baseline
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Gradium commit
        uses: actions/checkout@v4
        with:
          ref: e5110afd3ead725c940b6411eec4985fb8b111aa
          persist-credentials: false
      - name: Capture environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kairos-results
          {
            echo "checkout_commit=$(git rev-parse HEAD)"
            echo "runner_sha=$GITHUB_SHA"
            echo "threads=$(nproc)"
            uname -a
            lscpu
            free -m
            df -h
          } | tee kairos-results/environment.log
          test "$(git rev-parse HEAD)" = "e5110afd3ead725c940b6411eec4985fb8b111aa"
      - name: Build official benchmark
        run: cargo build --release -p ptts --example bench --features hf
      - name: Download public Phonon 31m model
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --user huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          path = snapshot_download(repo_id="gradium/phonon-31m-en", local_dir="phonon-model")
          print("Model downloaded:", path)
          PY
          find phonon-model -maxdepth 3 -type f | sort | tee kairos-results/model-files.log
      - name: Run official sequential k1 benchmark twice
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="phonon-model/config.json"
          MODEL="phonon-model/model.safetensors"
          test -f "$CONFIG" && test -f "$MODEL"
          VOICE="$(python - <<'PY'
          import json, pathlib
          root = pathlib.Path("phonon-model")
          config = json.loads((root / "config.json").read_text())
          baked = config.get("voices", [])
          if baked:
              print(baked[0]["name"])
          else:
              candidates = [root / "default-voice.safetensors"]
              candidates += sorted((root / "voices").glob("*.safetensors"))
              candidates += sorted((root / "embeddings").glob("*.safetensors"))
              print(next((str(p) for p in candidates if p.is_file()), ""))
          PY
          )"
          if [ -z "$VOICE" ]; then
            echo 'No baked-in voice or separate embedding found; inspect model-files.log.' >&2
            exit 1
          fi
          echo "Selected model=$MODEL config=$CONFIG voice=$VOICE" | tee kairos-results/model-selection.log
          for REP in 1 2; do
            ./target/release/examples/bench --model "$MODEL" --config "$CONFIG" --voice "$VOICE" --lang en --cpu --threads "$(nproc)" --seed 42 --iters 10 --warmup 2 --per-iter 2>&1 | tee "kairos-results/k1_rep${REP}.log"
          done
      - name: Upload audit logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-k1-audit
          path: kairos-results/
          retention-days: 30
