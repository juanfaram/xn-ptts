name: KAIROS RSS confirmed live 5s
on:
  push:
    branches: ['run/kairos-rss-confirm-live']
    paths: ['.github/workflows/kairos-rss-confirm-live.yml', 'scripts/kairos_rss_calibrate.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen source and environment audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/rss-confirm-live
          git fetch origin e5110afd3ead725c940b6411eec4985fb8b111aa --depth=1
          git diff --exit-code e5110afd3ead725c940b6411eec4985fb8b111aa HEAD -- ptts/src ptts-ws-server/src ptts-ws-server/Cargo.toml
          { git rev-parse HEAD; git log --oneline -3; nproc; lscpu; free -m; } > out/rss-confirm-live/env.txt
          python3 -m py_compile scripts/kairos_rss_calibrate.py
      - name: Download model and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user huggingface_hub 'websockets>=13,<17'
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id="gradium/phonon-31m-en",local_dir="phonon-model")
          PY
          find phonon-model -type f | sort > out/rss-confirm-live/model-files.txt
      - name: Compile original server
        run: cargo build --release -p ptts-ws-server
      - name: Start original WS server m8
        shell: bash
        run: |
          set -euo pipefail
          RUST_LOG=info ./target/release/ptts-ws-server --model phonon-model --voice-catalog '' --lang en --device cpu --max-concurrent-requests 120 --addr 127.0.0.1:8080 > out/rss-confirm-live/server.log 2>&1 &
          echo $! > out/rss-confirm-live/server.pid
          python3 - <<'PY'
          import socket,time,subprocess
          for i in range(120):
              if subprocess.run(["kill","-0",open("out/rss-confirm-live/server.pid").read().strip()],capture_output=True).returncode:
                  raise SystemExit("server exited")
              try:
                  s=socket.create_connection(("127.0.0.1",8080),timeout=1);s.close();break
              except OSError:time.sleep(1)
          else:raise SystemExit("server did not start")
          PY
      - name: Measure idle WS RSS at 0 10 25 50 100
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kairos_rss_calibrate.py --pid "$(cat out/rss-confirm-live/server.pid)" --output out/rss-confirm-live/rows.json | tee out/rss-confirm-live/run.log
      - name: Hash source binary and all evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/rss-confirm-live
          { git rev-parse HEAD; sha256sum scripts/kairos_rss_calibrate.py; sha256sum target/release/ptts-ws-server || true; } > out/rss-confirm-live/build-identity.txt
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('out/rss-confirm-live')
          items={}
          for f in sorted(p.iterdir()):
              if f.is_file() and f.name!='manifest.json':
                  items[f.name]=hashlib.sha256(f.read_bytes()).hexdigest()
          (p/'manifest.json').write_text(json.dumps({'sha256_files':items,'meaning':'Evidence integrity only; does not certify clean delivery'},indent=2)+'\n')
          PY
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-rss-confirm-live-evidence
          path: out/rss-confirm-live/
          retention-days: 30
