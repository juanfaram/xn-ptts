name: KAIROS activity 25pct B6 B8 C6 real WS
on:
  push:
    branches:
      - 'run/kairos-activity-quarter'
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: B
            permits: 6
            occupancy: 6
            label: B6
          - arm: B
            permits: 8
            occupancy: 8
            label: B8
          - arm: C
            permits: 6
            occupancy: 8
            label: C6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen Gradium source and record runner
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin e5110afd3ead725c940b6411eec4985fb8b111aa --depth=1
          git diff --exit-code e5110afd3ead725c940b6411eec4985fb8b111aa HEAD -- ptts/src ptts-ws-server/src ptts-ws-server/Cargo.toml
          mkdir -p out
          { echo "source=e5110afd3ead725c940b6411eec4985fb8b111aa"; echo "patch=$GITHUB_SHA"; echo "arm=${{ matrix.label }}"; lscpu; free -m; } > out/environment.log
      - name: Install WS client and test fixture
        run: |
          python3 -m pip install websockets huggingface_hub
          python3 scripts/kairos_ws_selftest.py
      - name: Apply C only on C arm
        if: matrix.arm == 'C'
        run: python3 scripts/kairos_patch_ws_c.py
      - name: Compile server from current source
        env:
          RUSTFLAGS: '-C target-cpu=x86-64'
        run: cargo build --release -p ptts-ws-server
      - name: Download same checkpoint
        run: |
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          print(snapshot_download(repo_id="gradium/phonon-31m-en",local_dir="phonon-model"))
          PY
      - name: Real 16 clients, 30s idle, 4 generators and late client
        shell: bash
        run: |
          set -euo pipefail
          RAYON_NUM_THREADS="$(nproc)" ./target/release/ptts-ws-server --addr 127.0.0.1:8080 --model phonon-model --lang en --device cpu --max-concurrent-requests ${{ matrix.permits }} --voice-dir phonon-model > out/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 120); do
            if ! kill -0 "$PID" 2>/dev/null; then echo SERVER_EXITED;tail -80 out/server.log;exit 1;fi
            if python3 - <<'PY'
          import socket
          s=socket.socket();s.settimeout(.2)
          try:s.connect(('127.0.0.1',8080));exit(0)
          except OSError:exit(1)
          finally:s.close()
          PY
            then READY=1;break;fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then echo SERVER_START_TIMEOUT;tail -80 out/server.log;exit 1;fi
          python3 scripts/kairos_ws_phased.py --arm ${{ matrix.arm }} --permits ${{ matrix.permits }} --occupancy ${{ matrix.occupancy }} --active-generators 4 --idle-seconds 30 --timeout 180 --output out/${{ matrix.label }}-a025.json 2>&1 | tee out/client.log
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-a025-${{ matrix.label }}
          path: out/
          retention-days: 30
